services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stkmotor:latest
    container_name: stkmotor-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stkuser}:${POSTGRES_PASSWORD:-stkpassword}@db:5432/${POSTGRES_DB:-stkmotor}?schema=public
      - JWT_SECRET=${JWT_SECRET:-stkmotor-default-jwt-secret-replace-in-production-min-32-chars}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123456!}
      - ADMIN_NAME=${ADMIN_NAME:-مدیر سایت}
      - DIDAR_API_KEY=${DIDAR_API_KEY:-96n9yze8bh44j8xpghr5pbs4gs6s5rv3}
      - DIDAR_PIPELINE_ID=${DIDAR_PIPELINE_ID:-5e5b295e-155c-4f79-a3b6-c23e39ab9ec9}
      - DIDAR_STAGE_ID=${DIDAR_STAGE_ID:-9548e842-86f2-4db3-aa51-b41b16b4767d}
      - DIDAR_OWNER_ID=${DIDAR_OWNER_ID:-6b60f98f-7594-40e4-ba9c-2d3e53876d7b}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - product_uploads:/app/public/products
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: stkmotor-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stkuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-stkpassword}
      - POSTGRES_DB=${POSTGRES_DB:-stkmotor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stkuser} -d ${POSTGRES_DB:-stkmotor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  product_uploads:
    driver: local
