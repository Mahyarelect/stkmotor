services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stkmotor:latest
    container_name: stkmotor-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/db/custom.db
      - JWT_SECRET=${JWT_SECRET:-stkmotor-default-jwt-secret-replace-in-production-min-32-chars}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123456!}
      - ADMIN_NAME=${ADMIN_NAME:-مدیر سایت}
    volumes:
      - ./db:/app/db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
